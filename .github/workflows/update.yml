name: Update Gap Finder

# Fetches recent papers per topic, builds citation trees, finds gaps (optionally refined by
# Claude), commits the data and publishes the site to GitHub Pages.
on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC (06:30 IST)
  workflow_dispatch:
    inputs:
      only:
        description: "Only these categories (comma-separated: nand,dram,power,wbg). Blank = all."
        required: false
        default: ""
      refresh:
        description: "Rebuild every citation tree, even recent ones"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gap-finder-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: npm test

      - name: Fetch papers, build trees, find gaps
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GAPFINDER_MODEL: ${{ vars.GAPFINDER_MODEL }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          ONLY: ${{ inputs.only }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$REFRESH" = "true" ]; then ARGS+=(--refresh); fi
          node pipeline/run.mjs "${ARGS[@]}"

      - name: Commit updated data
        run: |
          git config user.name "gap-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Gap Finder data ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi

      - name: Stamp asset versions
        run: sed -i "s/__V__/${GITHUB_SHA::8}-$(date -u +%H%M)/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
